name: Sync Substack essays

on:
  schedule:
    # once a week (Mondays, 11:17 UTC); run it by hand from the Actions tab to sync sooner
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_essays.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/essays.json; then
            echo "No new essays."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/essays.json
          git commit -m "Sync Substack essays (Spanish + English)"
          git push
