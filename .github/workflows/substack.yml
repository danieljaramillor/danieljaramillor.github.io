name: Sync Substack essays

on:
  schedule:
    # every 3 hours: a post published on either Substack shows up on the site within a few hours
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_essays.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/essays.json; then
            echo "No new essays."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/essays.json
          git commit -m "Sync Substack essays (Spanish + English)"
          git push
