name: Test Substack import
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/essays.json'
      - '.github/workflows/*substack*'
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
